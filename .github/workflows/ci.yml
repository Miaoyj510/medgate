name: CI

on:
  push:
    branches: [main, "feature/**", "review/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: pip install -e "./medgate[dev]"
      - name: 静态检查
        run: python -m ruff check medgate/src medgate/tests
      - name: 全量测试
        run: python -m pytest medgate/tests -q
      - name: 目录导入冒烟
        run: |
          mkdir -p medgate/data
          export DATABASE_URL="sqlite:///./medgate/data/ci.db"
          python -m medgate.cli init-db
          python -m medgate.cli import-catalog --file medgate/seed/catalog_sample.csv
          python -m medgate.cli catalog-stats
